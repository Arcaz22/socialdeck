basePath: /api/v1
definitions:
  auth.AccessTokenResponse:
    properties:
      access_token:
        type: string
    type: object
  auth.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  auth.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  auth.MeResponse:
    properties:
      user:
        $ref: '#/definitions/auth.UserResponse'
    type: object
  auth.MessageResponse:
    properties:
      message:
        type: string
    type: object
  auth.RegisterRequest:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
      username:
        maxLength: 30
        minLength: 3
        type: string
    required:
    - email
    - password
    - username
    type: object
  auth.RegisterResponse:
    properties:
      message:
        type: string
      user:
        $ref: '#/definitions/auth.UserResponse'
    type: object
  auth.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      username:
        type: string
    type: object
  deck.AddCardRequest:
    properties:
      content:
        minLength: 1
        type: string
      type:
        type: string
    required:
    - content
    - type
    type: object
  deck.CardResponse:
    properties:
      card:
        $ref: '#/definitions/domain.Card'
    type: object
  deck.CreateDeckRequest:
    properties:
      is_public:
        type: boolean
      mode:
        type: string
      name:
        maxLength: 100
        minLength: 1
        type: string
    required:
    - mode
    - name
    type: object
  deck.DeckDetailResponse:
    properties:
      cards:
        items:
          $ref: '#/definitions/domain.Card'
        type: array
      deck:
        $ref: '#/definitions/domain.Deck'
    type: object
  deck.DeckListResponse:
    properties:
      decks:
        items:
          $ref: '#/definitions/domain.Deck'
        type: array
    type: object
  deck.DeckResponse:
    properties:
      deck:
        $ref: '#/definitions/domain.Deck'
    type: object
  deck.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  deck.MessageResponse:
    properties:
      message:
        type: string
    type: object
  deck.UpdateDeckRequest:
    properties:
      is_public:
        type: boolean
      mode:
        type: string
      name:
        maxLength: 100
        minLength: 1
        type: string
    required:
    - mode
    - name
    type: object
  domain.Card:
    properties:
      content:
        type: string
      deckID:
        type: string
      id:
        type: string
      type:
        description: truth | dare
        type: string
    type: object
  domain.Deck:
    properties:
      cardCount:
        type: integer
      createdAt:
        type: string
      createdBy:
        type: string
      id:
        type: string
      isPublic:
        type: boolean
      isSystem:
        description: true = deck bawaan app, tidak bisa diedit
        type: boolean
      mode:
        description: truth_or_dare | truth_or_truth | talk_more
        type: string
      name:
        type: string
    type: object
  domain.PlayerInfo:
    properties:
      is_connected:
        type: boolean
      turn_order:
        type: integer
      user_id:
        type: string
      username:
        type: string
    type: object
  game.CreateRoomRequest:
    properties:
      deck_id:
        type: string
    required:
    - deck_id
    type: object
  game.GameErrorResponse:
    properties:
      error:
        type: string
    type: object
  game.GameMessageResponse:
    properties:
      message:
        type: string
    type: object
  game.GameRoomResponse:
    properties:
      code:
        type: string
      session_id:
        type: string
    type: object
  game.JoinRoomRequest:
    properties:
      code:
        type: string
    required:
    - code
    type: object
  game.RoomStatePayload:
    properties:
      code:
        type: string
      current_turn_user_id:
        type: string
      host_id:
        type: string
      players:
        items:
          $ref: '#/definitions/domain.PlayerInfo'
        type: array
      session_id:
        type: string
      status:
        type: string
    type: object
  game.WebSocketTicketResponse:
    properties:
      expires_in:
        type: integer
      ticket:
        type: string
    type: object
info:
  contact: {}
  description: Social Deck backend API.
  title: Social Deck API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.AccessTokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: Login with email and password
      tags:
      - Auth
  /auth/logout:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.MessageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Logout the current user
      tags:
      - Auth
  /auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.MeResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get current authenticated user
      tags:
      - Auth
  /auth/refresh:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.AccessTokenResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: Rotate refresh token and issue a new access token
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Register request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.RegisterResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: Register a new user
      tags:
      - Auth
  /decks:
    get:
      description: Get all public decks, including system decks and public user decks.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/deck.DeckListResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/deck.ErrorResponse'
      summary: List public decks
      tags:
      - Decks
    post:
      consumes:
      - application/json
      description: Create a new deck owned by the authenticated user.
      parameters:
      - description: Create deck request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/deck.CreateDeckRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/deck.DeckResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/deck.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/deck.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/deck.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/deck.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/deck.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a deck
      tags:
      - Decks
  /decks/{id}:
    delete:
      description: Delete a deck owned by the authenticated user.
      parameters:
      - description: Deck ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/deck.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/deck.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/deck.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/deck.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/deck.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/deck.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a deck
      tags:
      - Decks
    get:
      description: Get a deck and its cards. Private decks are only available to their
        owner.
      parameters:
      - description: Deck ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/deck.DeckDetailResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/deck.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/deck.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/deck.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/deck.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/deck.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get deck detail
      tags:
      - Decks
    put:
      consumes:
      - application/json
      description: Update name, mode, and visibility for a deck owned by the authenticated
        user.
      parameters:
      - description: Deck ID
        in: path
        name: id
        required: true
        type: string
      - description: Update deck request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/deck.UpdateDeckRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/deck.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/deck.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/deck.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/deck.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/deck.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/deck.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a deck
      tags:
      - Decks
  /decks/{id}/cards:
    post:
      consumes:
      - application/json
      description: Add a truth or dare card to a deck owned by the authenticated user.
      parameters:
      - description: Deck ID
        in: path
        name: id
        required: true
        type: string
      - description: Add card request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/deck.AddCardRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/deck.CardResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/deck.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/deck.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/deck.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/deck.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/deck.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Add a card to a deck
      tags:
      - Decks
  /decks/{id}/cards/{cardId}:
    delete:
      description: Delete a card from a deck owned by the authenticated user.
      parameters:
      - description: Deck ID
        in: path
        name: id
        required: true
        type: string
      - description: Card ID
        in: path
        name: cardId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/deck.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/deck.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/deck.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/deck.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/deck.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/deck.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a card from a deck
      tags:
      - Decks
  /decks/me:
    get:
      description: Get all decks owned by the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/deck.DeckListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/deck.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/deck.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List my decks
      tags:
      - Decks
  /game/rooms:
    post:
      consumes:
      - application/json
      description: Create a game room from a deck. The authenticated user becomes
        the host.
      parameters:
      - description: Create room request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/game.CreateRoomRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/game.GameRoomResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/game.GameErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/game.GameErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/game.GameErrorResponse'
      security:
      - BearerAuth: []
      summary: Create game room
      tags:
      - Game
  /game/rooms/{id}/leave:
    post:
      description: Leave a waiting room. If the host leaves while waiting, the room
        is finished/cancelled.
      parameters:
      - description: Session ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/game.GameMessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/game.GameErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/game.GameErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/game.GameErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/game.GameErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/game.GameErrorResponse'
      security:
      - BearerAuth: []
      summary: Leave game room
      tags:
      - Game
  /game/rooms/{id}/state:
    get:
      description: Get current game room state, players, host, and current turn.
      parameters:
      - description: Session ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/game.RoomStatePayload'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/game.GameErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/game.GameErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/game.GameErrorResponse'
      security:
      - BearerAuth: []
      summary: Get game room state
      tags:
      - Game
  /game/rooms/{id}/ws:
    get:
      description: Upgrade to a WebSocket connection for realtime game events. Get
        a short-lived ticket from /game/rooms/{id}/ws-ticket first, then pass it as
        query parameter.
      parameters:
      - description: Session ID
        in: path
        name: id
        required: true
        type: string
      - description: Short-lived WebSocket ticket
        in: query
        name: ticket
        required: true
        type: string
      produces:
      - application/json
      responses:
        "101":
          description: Switching Protocols
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/game.GameErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/game.GameErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/game.GameErrorResponse'
      summary: Connect to game room WebSocket
      tags:
      - Game
  /game/rooms/{id}/ws-ticket:
    post:
      description: Create a short-lived one-time ticket for connecting to a game room
        WebSocket.
      parameters:
      - description: Session ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/game.WebSocketTicketResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/game.GameErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/game.GameErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/game.GameErrorResponse'
      security:
      - BearerAuth: []
      summary: Create WebSocket ticket
      tags:
      - Game
  /game/rooms/join:
    post:
      consumes:
      - application/json
      description: Join an existing waiting game room by room code.
      parameters:
      - description: Join room request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/game.JoinRoomRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/game.GameRoomResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/game.GameErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/game.GameErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/game.GameErrorResponse'
      security:
      - BearerAuth: []
      summary: Join game room
      tags:
      - Game
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
