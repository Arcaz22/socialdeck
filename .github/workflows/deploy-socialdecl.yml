name: Build and Deploy Socialdeck Backend

on:
  workflow_dispatch:
    inputs:
      slot:
        description: Deployment slot to update
        required: true
        default: auto
        type: choice
        options:
          - auto
          - blue
          - green
      promote:
        description: Switch Nginx traffic to this slot after healthcheck
        required: true
        default: false
        type: boolean
      image_tag:
        description: Optional existing image tag for rollback
        required: false
        default: ''
        type: string
  push:
    branches: [main]
    paths:
      - '**'
      - '!README.md'
      - '!TESTING_WEBSOCKET.md'
      - '!docs/**'
      - '!.gitignore'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_SLOT: ${{ inputs.slot || 'auto' }}
      PROMOTE: ${{ inputs.promote || false }}
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
      ROLLBACK_TAG: ${{ inputs.image_tag }}
      IMAGE: ${{ secrets.DOCKER_USERNAME }}/socialdeck-backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image
        run: |
          if [ -n "$ROLLBACK_TAG" ]; then
            echo "Using existing image tag: $ROLLBACK_TAG"
            exit 0
          fi
          docker build -t "$IMAGE:$IMAGE_TAG" -t "$IMAGE:main" .
          docker push "$IMAGE:$IMAGE_TAG"
          docker push "$IMAGE:main"

      - name: Install cloudflared
        env:
          CLOUDFLARED_VERSION: 2026.9.1
        run: |
          set -euo pipefail
          curl -fsSL -o /usr/local/bin/cloudflared \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64"
          chmod +x /usr/local/bin/cloudflared

      - name: Configure SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Configure Cloudflare SSH
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cat >> ~/.ssh/config <<EOF
          Host deploy-target
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityAgent $SSH_AUTH_SOCK
            StrictHostKeyChecking accept-new
            ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %h --service-token-id $TUNNEL_SERVICE_TOKEN_ID --service-token-secret $TUNNEL_SERVICE_TOKEN_SECRET
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy image by commit SHA
        run: |
          ssh deploy-target \
            "DEPLOY_PATH='$DEPLOY_PATH' DEPLOY_SLOT='$DEPLOY_SLOT' PROMOTE='$PROMOTE' IMAGE_TAG='$IMAGE_TAG' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          if [ "$DEPLOY_SLOT" = "auto" ]; then
            ACTIVE_SLOT="$(cat .active-slot-socialdeck 2>/dev/null || true)"
            if [ -z "$ACTIVE_SLOT" ]; then
              if grep -q 'server app-socialdeck-blue:' nginx/active/upstreams-socialdeck.conf 2>/dev/null; then
                ACTIVE_SLOT=blue
              elif grep -q 'server app-socialdeck-green:' nginx/active/upstreams-socialdeck.conf 2>/dev/null; then
                ACTIVE_SLOT=green
              else
                ACTIVE_SLOT=green
              fi
            fi
            if [ "$ACTIVE_SLOT" = "blue" ]; then TARGET_SLOT=green; else TARGET_SLOT=blue; fi
          else
            TARGET_SLOT="$DEPLOY_SLOT"
          fi
          export COMPOSE_PROJECT_NAME="apps-${TARGET_SLOT}"
          if [ "$TARGET_SLOT" = "blue" ]; then
            export SOCIALDECK_BLUE_IMAGE_TAG="$IMAGE_TAG"
          else
            export SOCIALDECK_GREEN_IMAGE_TAG="$IMAGE_TAG"
          fi
          docker compose -f docker-compose.apps.yml --profile "$TARGET_SLOT" config -q
          docker compose -f docker-compose.apps.yml --profile "$TARGET_SLOT" pull "app-socialdeck-${TARGET_SLOT}"
          docker compose -f docker-compose.apps.yml --profile "$TARGET_SLOT" up -d --wait "app-socialdeck-${TARGET_SLOT}"
          docker compose -f docker-compose.apps.yml --profile "$TARGET_SLOT" ps "app-socialdeck-${TARGET_SLOT}"

          if [ "$PROMOTE" = "true" ]; then
            cp "nginx/slots/socialdeck-${TARGET_SLOT}.conf" nginx/active/upstreams-socialdeck.conf
            docker compose -p infrastructure -f docker-compose.yml exec -T nginx nginx -t
            docker compose -p infrastructure -f docker-compose.yml exec -T nginx nginx -s reload
            printf '%s\n' "$TARGET_SLOT" > .active-slot-socialdeck
          fi
          docker image prune -f
          REMOTE_SCRIPT
